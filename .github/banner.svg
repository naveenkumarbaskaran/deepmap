<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06060f"/>
      <stop offset="60%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#12122a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)" rx="12"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="140" rx="220" ry="160" fill="url(#glow1)"/>
  <ellipse cx="900" cy="100" rx="300" ry="200" fill="url(#glow2)"/>

  <!-- Dot grid -->
  <g opacity="0.07">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#6366f1"/>
    </pattern>
    <rect width="1200" height="280" fill="url(#dots)" rx="12"/>
  </g>

  <!-- ── Neural network illustration ── -->

  <!-- Connection lines (behind nodes) -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.18">
    <!-- Input → Hidden1 -->
    <line x1="82" y1="84" x2="162" y2="104"/>
    <line x1="82" y1="84" x2="162" y2="140"/>
    <line x1="82" y1="84" x2="162" y2="176"/>
    <line x1="82" y1="140" x2="162" y2="104"/>
    <line x1="82" y1="140" x2="162" y2="140"/>
    <line x1="82" y1="140" x2="162" y2="176"/>
    <line x1="82" y1="196" x2="162" y2="104"/>
    <line x1="82" y1="196" x2="162" y2="140"/>
    <line x1="82" y1="196" x2="162" y2="176"/>
    <!-- Hidden1 → Hidden2 -->
    <line x1="174" y1="104" x2="254" y2="116"/>
    <line x1="174" y1="104" x2="254" y2="140"/>
    <line x1="174" y1="104" x2="254" y2="164"/>
    <line x1="174" y1="140" x2="254" y2="116"/>
    <line x1="174" y1="140" x2="254" y2="140"/>
    <line x1="174" y1="140" x2="254" y2="164"/>
    <line x1="174" y1="176" x2="254" y2="116"/>
    <line x1="174" y1="176" x2="254" y2="140"/>
    <line x1="174" y1="176" x2="254" y2="164"/>
    <!-- Hidden2 → Output -->
    <line x1="266" y1="116" x2="334" y2="140"/>
    <line x1="266" y1="140" x2="334" y2="140"/>
    <line x1="266" y1="164" x2="334" y2="140"/>
  </g>

  <!-- Input nodes -->
  <circle cx="82" cy="84"  r="11" fill="#06060f" stroke="#6366f1" stroke-width="1.8" filter="url(#softglow)"/>
  <circle cx="82" cy="140" r="11" fill="#06060f" stroke="#6366f1" stroke-width="1.8" filter="url(#softglow)"/>
  <circle cx="82" cy="196" r="11" fill="#06060f" stroke="#6366f1" stroke-width="1.8" filter="url(#softglow)"/>

  <!-- Hidden layer 1 -->
  <circle cx="168" cy="104" r="11" fill="#6366f118" stroke="#6366f1" stroke-width="1.8" filter="url(#softglow)"/>
  <circle cx="168" cy="140" r="11" fill="#6366f118" stroke="#6366f1" stroke-width="1.8" filter="url(#softglow)"/>
  <circle cx="168" cy="176" r="11" fill="#6366f118" stroke="#6366f1" stroke-width="1.8" filter="url(#softglow)"/>

  <!-- Hidden layer 2 -->
  <circle cx="260" cy="116" r="11" fill="#a855f718" stroke="#a855f7" stroke-width="1.8" filter="url(#softglow)"/>
  <circle cx="260" cy="140" r="11" fill="#a855f718" stroke="#a855f7" stroke-width="1.8" filter="url(#softglow)"/>
  <circle cx="260" cy="164" r="11" fill="#a855f718" stroke="#a855f7" stroke-width="1.8" filter="url(#softglow)"/>

  <!-- Output node -->
  <circle cx="340" cy="140" r="14" fill="#10b98120" stroke="#10b981" stroke-width="2.2" filter="url(#softglow)"/>
  <circle cx="340" cy="140" r="7"  fill="#10b98160"/>

  <!-- Layer labels -->
  <text x="82"  y="230" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Input</text>
  <text x="168" y="230" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Hidden</text>
  <text x="260" y="230" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Hidden</text>
  <text x="340" y="230" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Output</text>

  <!-- ── Main content ── -->

  <!-- Title -->
  <text x="420" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="72" font-weight="800" fill="url(#titleGrad)" filter="url(#softglow)" letter-spacing="-2">DeepMap</text>

  <!-- Tagline -->
  <text x="422" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="20" fill="#94a3b8" font-weight="400" letter-spacing="0.2">Learn AI the way it actually connects</text>

  <!-- Accent bar -->
  <rect x="422" y="162" width="380" height="2.5" rx="1.25" fill="url(#barGrad)" opacity="0.6"/>

  <!-- Stat chips -->
  <!-- 50 Lessons -->
  <rect x="422" y="185" width="118" height="30" rx="15" fill="#6366f112" stroke="#6366f130" stroke-width="1"/>
  <text x="481" y="205" font-family="system-ui,sans-serif" font-size="13" fill="#818cf8" font-weight="600" text-anchor="middle">50 Lessons</text>

  <!-- 6 Tracks -->
  <rect x="550" y="185" width="104" height="30" rx="15" fill="#a855f712" stroke="#a855f730" stroke-width="1"/>
  <text x="602" y="205" font-family="system-ui,sans-serif" font-size="13" fill="#c084fc" font-weight="600" text-anchor="middle">6 Tracks</text>

  <!-- Python -->
  <rect x="664" y="185" width="148" height="30" rx="15" fill="#10b98112" stroke="#10b98130" stroke-width="1"/>
  <text x="738" y="205" font-family="system-ui,sans-serif" font-size="13" fill="#34d399" font-weight="600" text-anchor="middle">In-Browser Python</text>

  <!-- Quizzes -->
  <rect x="822" y="185" width="140" height="30" rx="15" fill="#f59e0b12" stroke="#f59e0b30" stroke-width="1"/>
  <text x="892" y="205" font-family="system-ui,sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Live Quizzes</text>

  <!-- Tech stack line -->
  <text x="422" y="250" font-family="system-ui,sans-serif" font-size="12" fill="#334155" letter-spacing="0.5">
    Next.js  ·  React Flow  ·  Three.js  ·  Pyodide  ·  MDX  ·  KaTeX  ·  Framer Motion
  </text>
</svg>
